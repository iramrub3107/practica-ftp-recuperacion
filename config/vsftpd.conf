# 1. El servidor se inicia en modo standalone (independiente) usando IPv4
listen=YES
listen_ipv6=NO

# 2. Mensaje de bienvenida general que verá cualquier cliente al conectarse
ftpd_banner=--- Welcome to the FTP server of example.com---

# 3. Habilitar acceso anónimo (para descarga) y definir la raíz anónima
#    (Las subidas estarán DESHABILITADAS para anónimos)
anonymous_enable=YES
anon_root=/srv/ftp
anon_upload_enable=NO
anon_mkdir_write_enable=NO
# Mostrar mensaje de directorio al entrar (mostraremos /srv/ftp/.message)
dirmessage_enable=YES

# 4. Permitir usuarios locales (cuentas del sistema)
local_enable=YES

# 5. Permitir escritura para usuarios locales (subidas/creación)
write_enable=YES

# 6. Tiempo máximo de inactividad (cerrar conexiones inactivas) en segundos
idle_session_timeout=720

# 7. Restricciones de velocidad (bytes por segundo)
#    Usuarios locales: 5 MB/s => 5*1024*1024 = 5242880 bytes/s
local_max_rate=5242880
#    Usuarios anónimos: 2 MB/s => 2*1024*1024 = 2097152 bytes/s
anon_max_rate=2097152

# 8. Chroot (encarcelamiento) de usuarios locales: por defecto SÍ
#    y se usará una lista para excluir a los usuarios que NO estarán enjaulados.
chroot_local_user=YES
chroot_list_enable=YES
chroot_list_file=/etc/vsftpd.chroot

# 9. Para permitir chroot en directorios que son escribibles (evita errores de vsftpd)
#    (necesario en muchas versiones modernas de vsftpd)
allow_writeable_chroot=YES

# Configuración para servidor seguro
rsa_cert_file=/etc/ssl/certs/izanramos.com.pem
rsa_private_key_file=/etc/ssl/certs/izanramos.com.pem
ssl_enable=YES
allow_anon_ssl=NO
force_local_data_ssl=YES
force_local_logins_ssl=YES
ssl_tlsv1=YES
ssl_sslv2=NO
ssl_sslv3=NO
require_ssl_reuse=NO